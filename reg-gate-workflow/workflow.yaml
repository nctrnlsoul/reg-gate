# CRE workflow settings: one target for staging, one for production. No secrets are used.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "reg-gate-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""
    

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "reg-gate-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
